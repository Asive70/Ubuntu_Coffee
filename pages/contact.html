    </header>
    <section class="hero hero-small"><h1><i class="fas fa-phone-alt"></i> Get in Touch</h1></section>
    <main>
        <div class="contact-wrapper">
            <div class="form-container">
                <h2><i class="fas fa-envelope"></i> Send Message</h2>
                <form id="contactForm">
                    <div class="form-group"><label><i class="fas fa-user"></i> Name:</label><input type="text" required></div>
                    <div class="form-group"><label><i class="fas fa-envelope"></i> Email:</label><input type="email" required></div>
                    <div class="form-group"><label><i class="fas fa-comment"></i> Message:</label><textarea required></textarea></div>
                    <button type="submit" class="btn btn-full"><i class="fas fa-paper-plane"></i> Send</button>
                </form>
            </div>
            <div>
                <div class="info-box"><h3><i class="fas fa-info-circle"></i> Address</h3><p><i class="fas fa-map-pin"></i> 123 Govan Mbeki Ave, Gqeberha, 6001</p><p><i class="fas fa-phone"></i> 041 254 7854</p><p><i class="fas fa-clock"></i> Mon-Fri 7am-6pm - Sat-Sun 8am-4am</p></div>
                <div class="map-placeholder"><i class="fas fa-map-marked-alt"></i><h3>Find Us in Town</h3><p>Google Map: </p></div>
                 <h3>Find Us Here</h3>
                  <!-- Google Map Embed -->
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3309.314240819703!2d25.617518475523507!3d-33.958761773192315!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1e7ad2f413719f77%3A0x32f49f40fe0eaaf1!2s123%20Govan%20Mbeki%20St%2C%20Gqeberha%20Central%2C%20Gqeberha%2C%206001!5e0!3m2!1sen!2sza!4v1789713554619!5m2!1sen!2sza" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </div>
