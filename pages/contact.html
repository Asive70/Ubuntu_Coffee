<section class="hero hero-small"><h1><i class="fas fa-phone"></i> Contact Us</h1><p>123 Govan Mbeki Ave, Gqeberha Central, 6001</p></section>

<main>
<div style="display:flex; gap:20px; flex-wrap:wrap; padding:20px; max-width:1000px; margin:0 auto;">
<div class="form-container" style="flex:1; min-width:300px;">
<h2>Send Message</h2>
<form id="contactForm">
<input type="hidden" name="access_key" value="eed9e7b6-6e5d-4cd7-9d50-8680ab37b2c6">
<input type="hidden" name="subject" value="New Contact Message - Ubuntu Coffee">
<input type="hidden" name="from_name" value="Ubuntu Coffee Contact">

<div class="form-group"><label>Name:</label><input type="text" name="name" required placeholder="Your name"></div>
<div class="form-group"><label>Email:</label><input type="email" name="email" required placeholder="you@example.com"></div>
<div class="form-group"><label>Message:</label><textarea name="message" required rows="5" placeholder="Your message..."></textarea></div>
<button type="submit" class="btn btn-full" id="contactBtn"><i class="fas fa-paper-plane"></i> Send Message</button>
<p id="contactResult" style="text-align:center; margin-top:10px;"></p>
</form>
</div>

<div class="card" style="flex:1; min-width:300px;">
<h3><i class="fas fa-location-dot"></i> Visit Us</h3>
<p><strong>123 Govan Mbeki Ave, Central Gqeberha 6001</strong><br>041 254 7854<br>thando@ubuntucoffee.co.za</p>
<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3309.314240819703!2d25.617518475523507!3d-33.958761773192315!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1e7ad2f413719f77%3A0x32f49f40fe0eaaf1!2s123%20Govan%20Mbeki%20St%2C%20Gqeberha%20Central%2C%20Gqeberha%2C%206001!5e0!3m2!1sen!2sza!4v1789713554619!5m2!1sen!2sza" width="100%" height="300" style="border:0; border-radius:12px;" allowfullscreen loading="lazy"></iframe>
</div>
</div>
</main>

<footer><p>&copy; 2026 Ubuntu Coffee</p></footer>
<script src="../js/main.js"></script>
<script>
    
//contact
document.getElementById('contactForm').addEventListener('submit', async function(e){
 e.preventDefault();
 const btn=document.getElementById('contactBtn');
 const res=document.getElementById('contactResult');
 btn.innerHTML='Sending...'; btn.disabled=true;
 const data=Object.fromEntries(new FormData(this));
 try{
  const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(data)});
  const j=await r.json();
  if(j.success){ res.innerHTML='Sent! Redirecting...'; window.location.href='./thankyou.html'; }
  else res.innerHTML='Failed - try again';
 }catch{ res.innerHTML='Network error'; }
 btn.innerHTML='<i class="fas fa-paper-plane"></i> Send Message'; btn.disabled=false;
});
</script>
</body>
