<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book - Ubuntu Coffee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
</head>
<body>
    <header>
        <nav>
            <div class="logo"><i class="fas fa-mug-hot"></i> Ubuntu Coffee</div>
            <ul>
                <li><a href="../index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="./menu.html"><i class="fas fa-coffee"></i> Menu</a></li>
                <li><a href="./services.html"><i class="fas fa-concierge-bell"></i> Services</a></li>
                <li><a href="./book.html" class="active"><i class="fas fa-calendar-check"></i> Book</a></li>
                <li><a href="./about.html"><i class="fas fa-info-circle"></i> About</a></li>
                <li><a href="./blog.html"><i class="fas fa-blog"></i> Blog</a></li>
                <li><a href="./contact.html"><i class="fas fa-phone"></i> Contact</a></li>
                <li><a href="./enquiry.html"><i class="fas fa-envelope"></i> Enquiry</a></li>
            </ul>
        </nav>
    </header>
    <section class="hero hero-small"><h1><i class="fas fa-calendar-check"></i> Book a Table</h1></section>
    <main>
        <div class="form-container">
            <h2><i class="fas fa-book-open"></i> Reservation</h2>
            <form id="bookingForm">
                <div class="form-group"><label><i class="fas fa-user"></i> Full Name:</label><input type="text" id="name" required placeholder="Thandi Nkosi"></div>
                <div class="form-group"><label><i class="fas fa-envelope"></i> Email:</label><input type="email" id="email" required></div>
                <div class="form-group"><label><i class="fas fa-calendar"></i> Date:</label><input type="date" id="date" required></div>
                <div class="form-group"><label><i class="fas fa-clock"></i> Time:</label><input type="time" id="time" required></div>
                <div class="form-group"><label><i class="fas fa-users"></i> Guests:</label><select id="guests"><option>1-2</option><option>3-4</option><option>5-10</option></select></div>
                <div class="form-group"><label><i class="fas fa-comment"></i> Requests:</label><textarea id="message"></textarea></div>
                <button type="submit" class="btn btn-full"><i class="fas fa-check"></i> Confirm Booking</button>
            </form>
        </div>
    </main>
    <footer><p>&copy; 2026 Ubuntu_Coffee</p></footer>
    <script src="../script.js"></script>
</body>
</html>
