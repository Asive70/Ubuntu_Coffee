<link rel="stylesheet" href="../css/styles.css">
<link rel="icon" type="image/png" href="../assets/images/favicon.png">
</head>
<body>
<header>
<nav>
<div class="logo"><i class="fas fa-mug-hot"></i> Ubuntu Coffee</div>
<ul>
<li><a href="../index.html"><i class="fas fa-home"></i> Home</a></li>
<li><a href="./menu.html"><i class="fas fa-coffee"></i> Menu (<span id="cartCount">0</span>)</a></li>
<li><a href="./services.html"><i class="fas fa-concierge-bell"></i> Services</a></li>
<li><a href="./book.html" class="active"><i class="fas fa-calendar-check"></i> Book</a></li>
<li><a href="./about.html"><i class="fas fa-info-circle"></i> About</a></li>

</ul>
</nav>
</header>

<section class="hero hero-small"><h1><i class="fas fa-calendar-check"></i> Book a Table</h1></section>

<main>
<div class="form-container">
<h2>Book Your Spot - 123 Govan Mbeki</h2>
<form id="bookForm">
<input type="hidden" name="access_key" value="eed9e7b6-6e5d-4cd7-9d50-8680ab37b2c6">
<input type="hidden" name="subject" value="New Booking - Ubuntu Coffee">
<input type="hidden" name="from_name" value="Ubuntu Coffee Booking">

<div class="form-group"><label><i class="fas fa-user"></i> Name:</label><input type="text" name="name" id="bname" required placeholder="Your name"></div>
<div class="form-group"><label><i class="fas fa-envelope"></i> Email:</label><input type="email" name="email" id="bemail" required placeholder="you@example.com"></div>
<div class="form-group"><label><i class="fas fa-calendar"></i> Date:</label><input type="date" name="date" id="bdate" required></div>
<div class="form-group"><label><i class="fas fa-clock"></i> Time:</label><input type="time" name="time" id="btime" required></div>
<div class="form-group"><label><i class="fas fa-users"></i> Guests:</label><select name="guests" id="bguests" required><option value="">Select...</option><option>1 Person</option><option>2 People</option><option>4 People</option><option>Event Space (45 seats)</option></select></div>
<div class="form-group"><label><i class="fas fa-comment"></i> Notes:</label><textarea name="message" placeholder="Special requests"></textarea></div>
<button type="submit" class="btn btn-full" id="bookBtn"><i class="fas fa-paper-plane"></i> Book Now</button>
<p id="bookResult" style="text-align:center; margin-top:10px;"></p>
</form>
</div>
</main>

<footer><p>&copy; 2026 Ubuntu Coffee</p></footer>
<script src="../js/main.js"></script>
<script>
// book
document.getElementById('bdate').min = new Date().toISOString().split('T')[0];
document.getElementById('bookForm').addEventListener('submit', async function(e){
 e.preventDefault();
 const btn=document.getElementById('bookBtn');
 const res=document.getElementById('bookResult');
 btn.innerHTML='Booking...'; btn.disabled=true;
 const data=Object.fromEntries(new FormData(this));
 try{
  const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(data)});
  const j=await r.json();
  if(j.success){ res.innerHTML='Booked! Redirecting...'; window.location.href='./thankyou.html'; }
  else res.innerHTML='Failed - try again';
 }catch{ res.innerHTML='Network error'; }
 btn.innerHTML='<i class="fas fa-paper-plane"></i> Book Now'; btn.disabled=false;
});
</script>
</body>
</html>
