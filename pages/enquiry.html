        <nav>
            <div class="logo"><i class="fas fa-mug-hot"></i> Ubuntu Coffee</div>

    <section class="hero hero-small"><h1><i class="fas fa-envelope-open-text"></i> Enquiry</h1></section>
    <main>
        <div class="form-container">
            <h2><i class="fas fa-question-circle"></i> Send Enquiry</h2>
            <form id="enquiryForm">
                <div class="form-group"><label><i class="fas fa-user"></i> Name:</label><input type="text" required></div>
                <div class="form-group"><label><i class="fas fa-list"></i> Type:</label><select><option>Wholesale</option><option>Training</option><option>Office Supply</option><option>Catering</option></select></div>
                <div class="form-group"><label><i class="fas fa-envelope"></i> Email:</label><input type="email" required></div>
                <div class="form-group"><label><i class="fas fa-comment-dots"></i> Message:</label><textarea required></textarea></div>
                <button type="submit" class="btn btn-full"><i class="fas fa-paper-plane"></i> Send Enquiry</button>
            </form>
        </div>
    </main>
