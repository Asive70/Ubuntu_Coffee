<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - Ubuntu_Coffee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="../css/styles.css">
     <link rel="icon" type="image/png" href="../assets/images/favicon.png">
</head>
<body>
    <header>
        <nav>
            <div class="logo"><i class="fas fa-mug-hot"></i> Ubuntu Coffee</div>
            <ul>
                <li><a href="../index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="./menu.html"><i class="fas fa-coffee"></i> Menu (<span id="cartCount">0</span>)</a></li>
                <li><a href="./services.html"><i class="fas fa-concierge-bell"></i> Services</a></li>
                <li><a href="./book.html"><i class="fas fa-calendar-check"></i> Book</a></li>
                <li><a href="./about.html"><i class="fas fa-info-circle"></i> About</a></li>
                <li><a href="./blog.html"><i class="fas fa-blog"></i> Blog</a></li>
                <li><a href="./contact.html"><i class="fas fa-phone"></i> Contact</a></li>
                <li><a href="./enquiry.html" class="active"><i class="fas fa-envelope"></i> Enquiry</a></li>
            </ul>
        </nav>
    </header>
    <section class="hero hero-small"><h1><i class="fas fa-envelope-open-text"></i> Enquiry</h1></section>
    <main>
        <div class="form-container">
            <h2><i class="fas fa-question-circle"></i> Send Enquiry</h2>
            <form id="enquiryForm" action="https://formsubmit.co/ST10506474@RCCONNECT.EDU.ZA" method="POST">
                <!-- ADDED FOR EMAIL -->
                <input type="hidden" name="_subject" value="New Business Enquiry - Ubuntu Coffee">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_next" value="../pages/thankyou.html">

                <div class="form-group"><label><i class="fas fa-user"></i> Name:</label><input type="text" id="name" name="name" required placeholder="Your name"></div>
                <div class="form-group"><label><i class="fas fa-building"></i> Company:</label><input type="text" id="company" name="company" placeholder="Company (optional)"></div>
                <div class="form-group"><label><i class="fas fa-list"></i> Type:</label><select id="enquiry_type" name="enquiry_type" required><option value="">Select...</option><option>Wholesale</option><option>Training</option><option>Office Supply</option><option>Catering 50-180 Guests</option><option>Other</option></select></div>
                <div class="form-group"><label><i class="fas fa-envelope"></i> Email:</label><input type="email" id="email" name="email" required placeholder="you@example.com"></div>
                <div class="form-group"><label><i class="fas fa-phone"></i> Phone:</label><input type="tel" id="phone" name="phone" placeholder="0412547854"></div>
                <div class="form-group"><label><i class="fas fa-comment-dots"></i> Message:</label><textarea id="message" name="message" required placeholder="Tell us about your enquiry..."></textarea></div>
                <button type="submit" class="btn btn-full"><i class="fas fa-paper-plane"></i> Send Enquiry</button>
            </form>
        </div>
    </main>
    <footer><p>&copy; 2026 Ubuntu_Coffee</p></footer>
    <script src="../js/main.js"></script>
</body>
</html>
