        <h2>Book a Table or Event</h2>
        <form>
            <label>Name:</label><br>
            <input type="text" placeholder="Your Name" required><br><br>
            
            <label>Email:</label><br>
            <input type="email" placeholder="Your Email" required><br><br>

            <label>Date:</label><br>
            <input type="date" required><br><br>

            <label>Time:</label><br>
            <input type="time" required><br><br>

            <label>Number of Guests:</label><br>
            <input type="number" min="1" placeholder="1"><br><br>

            <label>Message / Special Request:</label><br>
            <textarea placeholder="Birthday, meeting, etc." rows="4"></textarea><br><br>
            
            <button type="submit">Book Now</button>
        </form>
