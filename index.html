<script>

function tick(){ 
  var el=document.getElementById('liveDateTime');
  if(!el) return;
  var now = new Date();

  // DD/MM/YYYY, HH:MM:SS 
  var saDateTime = now.toLocaleString('en-ZA', {
    day: '2-digit',
    month: '2-digit',
    year: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false,
    timeZone: 'Africa/Johannesburg'
  });
  // Shown as: 02/11/2026, 14:35:12 
  el.innerHTML='<i class="fas fa-clock"></i> '+ saDateTime + ' SAST';
}
tick(); setInterval(tick,1000);

// cart count
var cart=JSON.parse(localStorage.getItem('ubuntuCart')||'[]');
var c=cart.reduce((s,i)=>s+(i.qty||1),0);
document.querySelectorAll('#cartCount').forEach(e=>e.textContent=c);

// close modal on outside click
window.onclick=function(e){ var m=document.getElementById('specialModal'); if(e.target==m) m.style.display='none'; }
</script>
