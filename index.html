<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubuntu Coffee</title>
<link rel="stylesheet" href="./css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
#cartCount{background:#D4AF37;color:#000;padding:2px 7px;border-radius:50%;font-weight:bold}
</style>
</head>
<body>
<div style="background: linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)), url('./assets/images/ubuntu_coffee.jpg'); background-size:cover; background-position:center; min-height:100vh; position:relative;">
<nav style="display:flex; gap:15px; justify-content:center; padding:20px; background:rgba(0,0,0,0.5); flex-wrap:wrap;">
<a href="./index.html" style="color:#fff; border-bottom:2px solid #D4AF37; text-decoration:none;">Home</a>
<a href="./pages/menu.html" style="color:#fff; text-decoration:none;">Menu (<span id="cartCount">0</span>)</a>
<a href="./pages/book.html" style="color:#fff; text-decoration:none;">Book</a>
<a href="./pages/about.html" style="color:#fff; text-decoration:none;">About</a>
<a href="./pages/blog.html" style="color:#fff; text-decoration:none;">Blog</a>
<a href="./pages/contact.html" style="color:#fff; text-decoration:none;">Contact</a>
<a href="./pages/enquiry.html" style="color:#fff; text-decoration:none;">Enquiry</a>
</nav>
<div style="text-align:center; color:#fff; padding-top:120px;">
<h1 style="font-size:48px;">Ubuntu Coffee</h1>
<h2>I am because we are</h2>
<p id="liveDateTime" style="background:rgba(0,0,0,0.5); display:inline-block; padding:8px 16px; border-radius:20px; margin:20px 0;">Loading...</p>
<br>
<a href="./pages/book.html" style="background:#D4AF37; color:#000; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:bold; margin:5px; display:inline-block;">Book Now</a>
<a href="#" onclick="document.getElementById('specialModal').style.display='block'; return false;" style="background:#fff; color:#6F4E37; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:bold; margin:5px; display:inline-block;"><i class="fas fa-star"></i> Today's Special</a>
</div>
</div>

<div id="specialModal" style="display:none; position:fixed; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999;">
<div style="background:#fff; width:90%; max-width:400px; margin:15% auto; padding:25px; border-radius:12px; text-align:center; position:relative;">
<span onclick="document.getElementById('specialModal').style.display='none'" style="position:absolute; right:15px; top:5px; font-size:28px; cursor:pointer;">&times;</span>
<h2>Today's Special</h2>
<p><strong>Ubuntu Brew + Rusk - R45</strong> until 11am</p>
<a href="./pages/menu.html" style="background:#6F4E37; color:#fff; padding:10px 20px; border-radius:6px; text-decoration:none; display:inline-block; margin-top:10px;">Order Now</a>
</div>
</div>

<footer style="text-align:center; padding:20px; background:#6F4E37; color:#fff;">&copy; 2026 Ubuntu Coffee - 123 Govan Mbeki Ave</footer>

<script>

// live time
function tick(){ 
  var el=document.getElementById('liveDateTime');
  if(el) el.innerHTML='<i class="fas fa-clock"></i> '+new Date().toLocaleString();
}
tick(); setInterval(tick,1000);
// cart count
var cart=JSON.parse(localStorage.getItem('ubuntuCart')||'[]');
var c=cart.reduce((s,i)=>s+(i.qty||1),0);
document.querySelectorAll('#cartCount').forEach(e=>e.textContent=c);
// close modal on outside click
window.onclick=function(e){ var m=document.getElementById('specialModal'); if(e.target==m) m.style.display='none'; }
</script>
</body>
</html>
